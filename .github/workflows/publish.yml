name: CI & Publish to NPM

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to NPM after build and tests?'
        required: true
        type: boolean
        default: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Package
        run: pnpm build

      - name: Run Tests
        run: pnpm test

      - name: Publish to NPM
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM token is missing or empty! Please add or update 'NPM_TOKEN' under GitHub Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          pnpm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"
          pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN || secrets.NPM_AUTH_TOKEN }}
